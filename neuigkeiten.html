  <!-- Mobile Menu -->
  <div class="nav-mobile" id="navMobile" role="dialog" aria-label="Navigation">
    <a href="index.html"           class="nav-link">Home</a>

    <a href="index.html#ueber-uns" class="nav-link">Über uns</a>

  <!-- PAGE HEADER -->
  <header class="page-header section-dark" data-bg-text="NEWS">
    <p class="ph-eyebrow" data-cms="neuigkeiten:page_sub">Aktuelles &amp; Berichte</p>
    <h1 class="ph-title" data-cms="neuigkeiten:page_title">Neuigkeiten</h1>
    <div class="ph-rule"><div class="ph-rule-diamond"></div></div>
  </header>

  <!-- ALL NEWS – dynamisch aus der Datenbank geladen -->
  <section class="section section-mid reveal">
    <div class="container">
      <div class="news-grid" id="newsGrid">
        <!-- Skeleton-Platzhalter beim Laden -->
        <div class="news-card" style="pointer-events:none;opacity:.5" aria-hidden="true">
          <div class="nc-thumb" style="background:#181818"></div>
          <div class="nc-body">
            <div style="height:12px;width:60px;background:#333;border-radius:4px;margin-bottom:.5rem"></div>
            <div style="height:18px;width:80%;background:#2a2a2a;border-radius:4px;margin-bottom:.5rem"></div>
            <div style="height:12px;width:100%;background:#222;border-radius:4px;margin-bottom:.25rem"></div>
            <div style="height:12px;width:70%;background:#222;border-radius:4px"></div>
          </div>
        </div>
      </div>
      <p id="newsEmpty" style="display:none;text-align:center;color:#888;padding:3rem 0">
        Noch keine Neuigkeiten vorhanden.
      </p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">

  <script src="script.js"></script>
  <script src="cms.js"></script>
  <script>
  (async function loadNews() {
    const grid  = document.getElementById('newsGrid');
    const empty = document.getElementById('newsEmpty');
    const TAG_ICONS = {
      'Vereinsnews':'📰','Spielbericht':'🏐','Ankündigung':'📣',
      'Erfolge':'🏆','Training':'🎽','Veranstaltung':'📅'
    };
    const TAG_GRADIENTS = {
      'Vereinsnews':'linear-gradient(160deg,#0c0c0c,#181818)',
      'Spielbericht':'linear-gradient(200deg,#0e0e0e,#1b1b1b)',
      'Erfolge':'linear-gradient(140deg,#0b0b0b,#171717)',
      'Ankündigung':'linear-gradient(310deg,#0d0d0d,#191919)',
      'Training':'linear-gradient(250deg,#111,#1c1c1c)',
      'Veranstaltung':'linear-gradient(180deg,#0f0f0f,#1a1a1a)'
    };
    function fmtDate(s) {
      if (!s) return '';
      return new Date(s).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
    }
    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    try {
      const news = await fetch('/api/news?published=1').then(r => r.json());
      if (!news.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      grid.innerHTML = news.map(n => {
        const icon = TAG_ICONS[n.tag] || '📰';
        const grad = TAG_GRADIENTS[n.tag] || 'linear-gradient(160deg,#0c0c0c,#181818)';
        const thumb = n.image_url
          ? `<img src="${esc(n.image_url)}" alt="${esc(n.title)}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0" loading="lazy">`
          : '';
        return `<a href="/news.html?id=${n.id}" class="news-card">
          <div class="nc-thumb" style="background:${grad};position:relative">
            ${thumb}
            <span class="nc-icon" style="${n.image_url?'display:none':''}"> ${icon}</span>
            <div class="nc-thumb-bg"></div>
            <span class="nc-tag">${esc(n.tag)}</span>
          </div>
          <div class="nc-body">
            <span class="nc-date">${fmtDate(n.publish_date||n.created_at)}</span>
            <h3>${esc(n.title)}</h3>
            <p>${esc(n.description||'').slice(0,140)}${(n.description||'').length>140?'…':''}</p>
            <span class="nc-more">Mehr lesen →</span>
          </div>
        </a>`;
      }).join('');
    } catch {
      grid.innerHTML = '<p style="color:#888;padding:1rem;grid-column:1/-1">Beiträge konnten nicht geladen werden.</p>';
    }
  })();
  </script>
</body>
</html>
