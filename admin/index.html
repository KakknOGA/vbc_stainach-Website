<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin – VBC Stainach</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --accent:  #6366f1;
      --accent2: #4f46e5;
      --danger:  #f85149;
      --radius:  12px;
    }
    [data-theme="light"] {
      --bg:      #f1f5f9;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --text:    #0f172a;
      --muted:   #64748b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem calc(1rem + env(safe-area-inset-left, 0px))
               calc(1.25rem + env(safe-area-inset-bottom, 0px))
               calc(1rem + env(safe-area-inset-right, 0px));
      transition: background .3s, color .3s;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(99,102,241,.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .login-cookie-note { margin-top: 1rem; font-size: .75rem; line-height: 1.5; opacity: .7; text-align: center; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      corner-shape: squircle;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 64px rgba(0,0,0,.4);
      animation: cardIn .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      corner-shape: squircle;
      box-shadow: 0 6px 20px rgba(99,102,241,.4);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: .75rem;
    }
    .login-logo:hover .login-logo-icon { transform: rotate(-8deg) scale(1.08); }
    .login-logo h1 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text);
    }
    .login-logo p {
      font-size: .8rem;
      color: var(--muted);
      margin-top: .2rem;
    }

    .form-group { margin-bottom: 1.125rem; }
    .form-label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .4rem;
    }
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      corner-shape: squircle;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(99,102,241,.2);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      corner-shape: squircle;
      padding: .8rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
      transition: transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s, filter .2s;
    }
    .btn-login:hover  {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,.45);
      filter: brightness(1.08);
    }
    .btn-login:active { transform: scale(.97); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .error-msg {
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.3);
      border-radius: 8px;
      color: var(--danger);
      font-size: .875rem;
      padding: .65rem 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.show { display: block; }

    .theme-toggle {
      position: fixed; top: 1.25rem; right: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: background .2s;
      z-index: 10;
    }
    .theme-toggle:hover { background: var(--border); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: .85rem;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    .loading-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: .2s; }
    .loading-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

    /* ── Handy ─────────────────────────────── */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.25rem; border-radius: 22px; }
      .login-logo { margin-bottom: 1.5rem; }
      /* Unter 16px zoomt iOS beim Fokussieren in das Feld hinein */
      .form-input { font-size: 16px; padding: .8rem 1rem; }
      .btn-login  { padding: .9rem; min-height: 48px; }
      .theme-toggle {
        top: calc(.75rem + env(safe-area-inset-top, 0px));
        right: .75rem;
        width: 44px; height: 44px;
      }
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="Design wechseln">🌙</button>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">🏐</div>
    <h1>VBC Stainach</h1>
    <p>Admin-Bereich · Anmelden</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="username">Benutzername</label>
      <input class="form-input" type="text" id="username" name="username"
             autocomplete="username" placeholder="admin" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Passwort</label>
      <input class="form-input" type="password" id="password" name="password"
             autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button class="btn-login" type="submit" id="submitBtn">Anmelden</button>
  </form>

  <p class="login-cookie-note">Beim Anmelden wird ein technisch notwendiges Session-Cookie gesetzt (24&nbsp;Stunden, wird beim Abmelden gelöscht). Es dient ausschließlich dazu, deine Anmeldung aufrechtzuerhalten.</p>

  <a href="/" class="back-link">← Zurück zur Website</a>
</div>

<script>
  /* Theme */
  const root  = document.documentElement;
  const btn   = document.getElementById('themeToggle');
  let theme   = localStorage.getItem('adminTheme') || 'dark';
  applyTheme(theme);
  btn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme); });
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('adminTheme', t);
  }

  /* Login */
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const submit = document.getElementById('submitBtn');
    const errEl  = document.getElementById('errorMsg');
    const un     = document.getElementById('username').value.trim();
    const pw     = document.getElementById('password').value;

    submit.disabled = true;
    submit.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
    errEl.classList.remove('show');

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: un, password: pw })
      });
      const data = await r.json();
      if (r.ok) {
        window.location.href = '/admin/dashboard';
      } else {
        errEl.textContent = data.error || 'Anmeldung fehlgeschlagen';
        errEl.classList.add('show');
        submit.disabled = false;
        submit.textContent = 'Anmelden';
      }
    } catch {
      errEl.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
      errEl.classList.add('show');
      submit.disabled = false;
      submit.textContent = 'Anmelden';
    }
  });
</script>
</body>
</html>
